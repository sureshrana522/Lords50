
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lord's Bespoke Tailor System 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#f1e292',
              DEFAULT: '#d4af37',
              dark: '#aa8a2e',
            },
            premiumBlack: '#0a0a0a',
            premiumDark: '#1a1a1a',
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #f1e292 0%, #d4af37 50%, #aa8a2e 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #f1e292 0%, #d4af37 50%, #aa8a2e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .premium-border {
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .premium-card {
      background: #1a1a1a;
      border: 1px solid rgba(212, 175, 55, 0.1);
      transition: all 0.3s ease;
    }
    .premium-card:hover {
      border-color: rgba(212, 175, 55, 0.5);
      transform: translateY(-2px);
    }
    /* Hide scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
